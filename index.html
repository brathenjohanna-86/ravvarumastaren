<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏆 Råvarumästaren</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 16px;
    font-family: Arial, sans-serif;
    background: #eef6ff;
}

.card {
    max-width: 520px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 24px;
    box-shadow: 0 4px 15px rgba(0,0,0,.15);
}

h1 {
    text-align: center;
    color: #2563eb;
}

.score {
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 15px;
}

.progress {
    width: 100%;
    height: 18px;
    background: #dbe6ff;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 20px;
}

.progress-fill {
    width: 0%;
    height: 100%;
    background: #22c55e;
    transition: 0.4s;
}

.symbol {
    text-align: center;
    font-size: 90px;
    margin: 10px 0;
}

.question {
    font-size: 1.8rem;
    font-weight: bold;
    text-align: center;
    margin: 15px 0;
}

#speakBtn {
    width: 100%;
    min-height: 60px;
    border: none;
    border-radius: 18px;
    background: #f59e0b;
    color: white;
    font-size: 1.1rem;
    margin-bottom: 15px;
    cursor: pointer;
}

.answer {
    width: 100%;
    min-height: 65px;
    border: none;
    border-radius: 18px;
    background: #3b82f6;
    color: white;
    font-size: 1.15rem;
    margin: 10px 0;
    cursor: pointer;
}

.answer:active
