<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Råvarumästaren</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#eef6ff;
    margin:0;
    padding:15px;
}

.card{
    max-width:500px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:20px;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
}

h1{
    text-align:center;
    color:#2563eb;
}

.score{
    text-align:center;
    font-size:20px;
    margin-bottom:15px;
}

.question{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    margin:20px 0;
}

.symbol{
    font-size:70px;
    text-align:center;
}

button{
    width:100%;
    min-height:60px;
    margin:8px 0;
    border:none;
    border-radius:15px;
    font-size:20px;
    cursor:pointer;
}

.answer{
    background:#3b82f6;
    color:white;
}

.answer:disabled{
    background:#cbd5e1;
    color:#555;
}

#speakBtn{
    background:#f59e0b;
    color:white;
}

#nextBtn{
    background:#22c55e;
    color:white;
    display:none;
}

#feedback{
    text-align:center;
    font-size:20px;
    margin-top:15px;
    min-height:80px;
}
</style>
</head>
<body>

<div class="card">

<h1>🏆 Råvarumästaren</h1>

<div class="score">
Poäng: <span id="score">0</span>
</div>

<div class="symbol" id="symbol"></div>

<div class="question" id="question"></div>

<button id="speakBtn">
🔊 Läs upp frågan
</button>

<div id="answers"></div>

<div id="feedback"></div>

<button id="nextBtn">
Nästa fråga
</button>

</div>

<script>

const questions = [
{
symbol:"🌳",
question:"Vad är en råvara?",
answers:[
"En färdig produkt",
"Något från naturen",
"Ett batteri"
],
correct:1
},
{
symbol:"♻️",
question:"Vad betyder återanvändning?",
answers:[
"Använda igen",
"Kasta",
"Bränna upp"
],
correct:0
},
{
symbol:"🔋",
question:"Vilken metall används i batterier?",
answers:[
"Litium",
"Papper",
"Cellulosa"
],
correct:0
}
];

let current = 0;
let points = 0;

const symbolEl = document.getElementById("symbol");
const questionEl = document.getElementById("question");
const answersEl = document.getElementById("answers");
const feedbackEl = document.getElementById("feedback");
const scoreEl = document.getElementById("score");
const nextBtn = document.getElementById("nextBtn");

function speak(text){

  if("speechSynthesis" in window){

    speechSynthesis.cancel();

    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = "sv-SE";

    speechSynthesis.speak(msg);
  }
}

document.getElementById("speakBtn")
.addEventListener("click", function(){

  speak(
    questions[current].question
  );

});

function loadQuestion(){

  const q = questions[current];

  symbolEl.textContent = q.symbol;
  questionEl.textContent = q.question;

  answersEl.innerHTML = "";
  feedbackEl.innerHTML = "";

  nextBtn.style.display = "none";

  q.answers.forEach(function(answer,index){

    const btn =
      document.createElement("button");

    btn.className = "answer";
    btn.textContent = answer;

    btn.onclick = function(){

      if(index === q.correct){

        feedbackEl.innerHTML =
          "✅ Rätt!";

        points++;
        scoreEl.textContent = points;

        document
        .querySelectorAll(".answer")
        .forEach(function(b){
          b.disabled = true;
        });

        nextBtn.style.display =
          "block";

      } else {

        btn.disabled = true;

        feedbackEl.innerHTML =
          "💡 Försök igen!";

      }

    };

    answersEl.appendChild(btn);

  });

}

nextBtn.addEventListener("click", function(){

  current++;

  if(current >= questions.length){

    document.querySelector(".card")
    .innerHTML = `
      <h1>🏆 Du klarade det!</h1>
      <p>Poäng: ${points}</p>
      <button onclick="location.reload()">
      Spela igen
      </button>
    `;

    return;
  }

  loadQuestion();

});

loadQuestion();

</script>

</body>
</html>
