<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Råvarumästaren</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#eef6ff;
    margin:0;
    padding:15px;
}

.card{
    max-width:500px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:20px;
    box-shadow:0 4px 10px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    color:#2563eb;
}

.progress{
    width:100%;
    height:20px;
    background:#dbeafe;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:20px;
}

.progress-fill{
    height:100%;
    width:0%;
    background:#22c55e;
    transition:.3s;
}

.symbol{
    text-align:center;
    font-size:72px;
}

.question{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    margin:20px 0;
}

button{
    width:100%;
    min-height:60px;
    border:none;
    border-radius:15px;
    margin:8px 0;
    font-size:20px;
}

.answer{
    background:#3b82f6;
    color:white;
}

.answer:disabled{
    background:#cbd5e1;
    color:#555;
}

#speakBtn{
    background:#f59e0b;
    color:white;
}

#nextBtn{
    background:#22c55e;
    color:white;
    display:none;
}

#feedback{
    text-align:center;
    font-size:22px;
    margin-top:15px;
    min-height:80px;
}

.memory{
    background:#ecfdf5;
    margin-top:10px;
    padding:10px;
    border-radius:10px;
}

.score{
    text-align:center;
    font-size:20px;
    margin-bottom:10px;
}
</style>
</head>
<body>

<div class="card">

<h1>🏆 Råvarumästaren</h1>

<div class="score">
Poäng: <span id="score">0</span>
</div>

<div class="progress">
<div class="progress-fill" id="progress"></div>
</div>

<div class="symbol" id="symbol"></div>

<div class="question" id="question"></div>

<button id="speakBtn">🔊 Läs upp frågan</button>

<div id="answers"></div>

<div id="feedback"></div>

<button id="nextBtn">Nästa fråga</button>

</div>

question:"Vad är en råvara?",
answers:["En färdig produkt","Något från naturen","Ett batteri"],
